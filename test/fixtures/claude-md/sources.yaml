  - id: trailofbits-security-dev
    filename: trailofbits-security-dev.md
    source: https://github.com/trailofbits/claude-code-config/blob/main/claude-md-template.md
    stars: 1400
    fetched: "2026-02-28"
    lines: 207
    what_it_attempts: >
      Global development standards template with hard code quality limits
      (100 lines/function, complexity <= 8, 5 positional params max),
      zero-warnings policy, language-specific toolchain prescriptions
      (Python/Node/Rust/Bash), supply chain security, mutation testing,
      property-based testing, agent-native-by-default philosophy
    why_interesting: >
      Trail of Bits security pedigree. Comprehensive multi-language
      template with quantitative hard limits on code quality.
      Replace-don't-deprecate and agent-native-by-default principles
      show forward-thinking design for AI-assisted development.

  - id: brainqub3-second-brain
