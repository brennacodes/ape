    stars: 10
    fetched: "2026-02-28"
    lines: 176
    what_it_attempts: >
      Local-first second brain agent with read/write access policies,
      multi-source retrieval (CRM, meetings, calendar, LinkedIn, YouTube),
      sub-agent delegation for calendar/CRM/meetings/research,
