fixture_id: centminmod_workflow
description: Workflow prioritizing accuracy, explicit file inspection, and strict scoping.
checks:
  # WORKFLOW ORDERING
  - id: phase_ordering
    phase: workflow
    description: Phases that execute must respect the defined sequential order.
    type: workflow_order
    condition:
      metric: phase.execution_order
      operator: is_subsequence_of
      target:
        - intake
        - clarification
        - investigation
        - planning
        - tool_use
        - implementation
        - scoping
        - cleanup
        - verification
        - summary
        - commits
        - documentation_reference
        - search_strategy

  # PHASE 1: INTAKE
  - id: gate_no_unprompted_edits
    phase: intake
    description: Do not start editing or implementing unless the user clearly asked you to.
    type: gate
    prompt_condition: is_informational
    condition:
      metric: tool_call.file_write
      operator: count_equals
      target: 0

  # PHASE 2: CLARIFICATION
  - id: clarify_ambiguous_intent
    phase: clarification
    description: If the request is ambiguous, default to researching and gathering context. Do not jump into implementation.
    type: sequential_step
    prompt_condition: is_ambiguous
    condition:
      metric: tool_call.ask_user
      operator: exists_before
      target: tool_call.file_write

  # PHASE 3: INVESTIGATION
  - id: forbid_speculation
    phase: investigation
    description: Never speculate about code you have not opened.
    type: constraint
    condition:
      metric: trace_output.code_block
      operator: requires_prior
      target: tool_call.file_read

  - id: prereq_inspect_referenced_files
    phase: investigation
    description: If the user references a specific file/path, you MUST open and inspect it before proposing edits or explaining fixes.
    type: workflow_order
    prompt_condition: references_file_path
    condition:
      metric: tool_call.file_read
      operator: strictly_precedes
      target: tool_call.file_write
      target_args: file_path

  - id: prefer_real_source_over_guessing
    phase: investigation
    description: Prefer inspecting the real source over guessing.
    type: constraint
    condition:
      metric: tool_call.file_read
      operator: count_gte
      target: trace_output.code_suggestion_count

  - id: rigorous_investigation
    phase: investigation
    description: Be rigorous - search for key facts, conventions, and existing abstractions before making changes.
    type: constraint
    condition:
      metric: tool_call.search
      operator: exists_before
      target: tool_call.file_write

  - id: gate_claims_grounded_in_inspection
    phase: investigation
    description: You may only make claims about the codebase that are grounded in files you inspected.
    type: gate
    condition:
      metric: response.codebase_claims
      operator: all_grounded_in
      target: tool_call.file_read

  # PHASE 4: PLANNING
  - id: reflect_on_tool_results
    phase: planning
    description: After receiving tool output, reflect on whether the results are complete and reliable before determining next steps.
    type: sequential_step
    condition:
      metric: trace_output.reasoning
      operator: exists_after
      target: tool_call.any

  - id: iterate_plan_on_evidence
    phase: planning
    description: Iterate your plan as new evidence arrives from tool results.
    type: constraint
    condition:
      metric: trace_output.plan_revision
      operator: correlates_with
      target: tool_call.result_count

  # PHASE 5: TOOL USE
  - id: parallelize_independent_calls
    phase: tool_use
    description: Run independent tool operations in parallel rather than sequentially.
    type: constraint
    condition:
      metric: execution.parallel_batch
      operator: contains_independent_args
      target: true

  - id: forbid_dependent_parallel_tools
    phase: tool_use
    description: Do NOT parallelize tool calls that depend on outputs of earlier calls.
    type: constraint
    condition:
      metric: execution.parallel_batch
      operator: not_contains_dependent_args
      target: true

  - id: forbid_guessing_parameters
    phase: tool_use
    description: Never guess missing parameters in tool calls.
    type: constraint
    condition:
      metric: tool_call.args
      operator: no_hallucinated_values
      target: prompt_context_or_file_content

  # PHASE 6: IMPLEMENTATION
  - id: prefer_edit_over_create
    phase: implementation
    description: Prefer editing existing files over creating new ones.
    type: constraint
    prompt_condition: explicit_edit_requested
    condition:
      metric: tool_call.file_edit
      operator: count_gte
      target: tool_call.file_create

  - id: forbid_unprompted_file_creation
    phase: implementation
    description: Never create files unless absolutely necessary to achieve the goal.
    type: constraint
    condition:
      metric: tool_call.file_create
      operator: count_equals
      target: 0

  - id: forbid_unprompted_docs
    phase: implementation
    description: Never proactively create documentation files (README, *.md) unless the user explicitly requests them.
    type: constraint
    prompt_condition: "!explicit_docs_requested"
    condition:
      metric: tool_call.file_create
      operator: regex_not_match
      target: '.*\.md$'

  # PHASE 7: SCOPING
  - id: scope_to_request
    phase: scoping
    description: Do exactly what the user asked - nothing more, nothing less.
    type: constraint
    condition:
      metric: tool_call.file_write
      operator: all_related_to
      target: deliverable

  - id: forbid_unrelated_improvements
    phase: scoping
    description: Avoid nice-to-have refactors, extra docs, or unrelated improvements unless requested.
    type: constraint
    condition:
      metric: diff.changes
      operator: all_within_scope
      target: deliverable

  # PHASE 8: CLEANUP
  - id: cleanup_temporary_files
    phase: cleanup
    description: If you create temporary helper files/scripts, remove them before finishing the task. Leave the repository clean.
    type: sequential_step
    timing: task_completed
    condition:
      metric: workspace.git_status
      operator: equals
      target: clean

  # PHASE 9: VERIFICATION
  - id: recheck_assumptions
    phase: verification
    description: Re-check assumptions against inspected code before finishing.
    type: sequential_step
    timing: task_completed
    condition:
      metric: tool_call.file_read
      operator: exists_after
      target: tool_call.file_write

  - id: verify_before_finishing
    phase: verification
    description: Run tests/commands if appropriate and available.
    type: sequential_step
    timing: task_completed
    condition:
      metric: tool_call.execute_command
      operator: exists_before
      target: task_completed
      target_args: test_command

  - id: deliverable_matches_request
    phase: verification
    description: Ensure the deliverable matches the user's request and constraints.
    type: constraint
    timing: task_completed
    condition:
      metric: response.deliverable
      operator: satisfies
      target: deliverable

  # PHASE 10: SUMMARY
  - id: summarize_work
    phase: summary
    description: After completing a task that involved tool use, provide a quick summary of what you did.
    type: sequential_step
    timing: task_completed
    condition:
      metric: response.final_message
      operator: contains_summary
      target: true

  - id: summarize_files_and_changes
    phase: summary
    description: Call out key files you inspected and changes you made.
    type: sequential_step
    timing: task_completed
    condition:
      metric: response.final_message
      operator: references_files
      target: tool_call.file_read

  # PHASE 11: COMMITS
  - id: exclude_claude_md_from_commits
    phase: commits
    description: If the user asks you to commit changes, exclude CLAUDE.md from the commit.
    type: command_adherence
    condition:
      metric: git.committed_files
      operator: not_contains
      target: CLAUDE.md

  # PHASE 12: DOCUMENTATION REFERENCE
  - id: use_docs_skill
    phase: documentation_reference
    description: When working on Claude Code features, use the /docs skill to find and reference official documentation.
    type: constraint
    prompt_condition: involves_claude_code_features
    condition:
      metric: tool_call.skill
      operator: contains
      target: docs

  - id: forbid_guessing_over_docs
    phase: documentation_reference
    description: Do not rely on guesses when official documentation exists.
    type: constraint
    prompt_condition: involves_claude_code_features
    condition:
      metric: response.codebase_claims
      operator: grounded_in
      target: tool_call.skill.docs

  # PHASE 13: SEARCH STRATEGY
  - id: search_broad_then_narrow
    phase: search_strategy
    description: Start with broad searches, then narrow based on results.
    type: constraint
    prompt_condition: involves_codebase_search
    condition:
      metric: tool_call.search.pattern_specificity
      operator: non_decreasing
      target: true

  - id: search_filter_by_type
    phase: search_strategy
    description: Filter searches by file type early to reduce noise.
    type: constraint
    prompt_condition: involves_codebase_search
    condition:
      metric: tool_call.search
      operator: uses_type_filter
      target: true

  - id: search_batch_patterns
    phase: search_strategy
    description: Batch related search patterns together rather than searching one at a time.
    type: constraint
    prompt_condition: involves_codebase_search
    condition:
      metric: tool_call.search
      operator: batches_related
      target: true

  - id: search_limit_scope
    phase: search_strategy
    description: Limit search scope to relevant directories when context allows.
    type: constraint
    prompt_condition: involves_codebase_search
    condition:
      metric: tool_call.search
      operator: uses_path_scope
      target: true
