fixture_id: centminmod_workflow
description: Workflow prioritizing accuracy, explicit file inspection, and strict scoping.

# ---------------------------------------------------------------------------
# PHASE CLASSIFICATION
# ---------------------------------------------------------------------------
# ordered_phases: must appear in the defined sequence when present.
# floating_phases: may appear at any point; excluded from ordering checks.
phase_classification:
  ordered:
    - intake
    - investigation
    - planning
    - implementation
    - cleanup
    - verification
    - summary
    - commits
  floating:
    - tool_use
    - documentation_reference
    - search_strategy

# ---------------------------------------------------------------------------
# PHASE TOOL MAPPING
# ---------------------------------------------------------------------------
# Maps phases to the trace signals a runner uses to infer when a phase is
# active. "position" disambiguates phases that share the same tool type
# (e.g. file_read in investigation vs. verification).
phase_tool_mapping:
  # intake: no programmatic signal exists in Claude Code session logs.
  # Kept in phase_classification.ordered for sequence enforcement but
  # excluded from phase detection.
  investigation:
    signals: [tool_call.file_read, tool_call.search]
    position: before_implementation
  # planning: response.text matches every inter-batch assistant message and
  # cannot reliably distinguish planning from other responses. Kept in
  # phase_classification.ordered but excluded from phase detection.
  tool_use:
    signals: [execution.parallel_batch]
    position: any
  implementation:
    signals: [tool_call.file_write, tool_call.file_edit, tool_call.file_create]
    position: any
    repeatable: true
  cleanup:
    signals: [tool_call.file_delete]
    position: after_implementation
  verification:
    signals: [tool_call.execute_command, tool_call.file_read]
    position: after_implementation
    repeatable: true
  summary:
    signals: [response.final_message]
    position: last
  commits:
    signals: [tool_call.execute_command]
    match: 'git commit'
    position: after_verification
  documentation_reference:
    signals: [tool_call.skill]
    match: docs
    position: any
  search_strategy:
    signals: [tool_call.search, tool_call.grep, tool_call.glob]
    position: any

checks:
  # WORKFLOW ORDERING
  # Only ordered phases are included. Floating phases (tool_use,
  # documentation_reference, search_strategy) are excluded — they may
  # appear at any point without violating sequencing.
  # Cycle-aware: repeatable phases (implementation, verification) may re-appear;
  # ordering is validated within each cycle independently.
  - id: phase_ordering
    phase: workflow
    description: Ordered phases that execute must respect the defined sequential order.
    type: workflow_order
    condition:
      metric: phase.execution_order
      operator: strictly_ordered_subset
      target: ${phase_classification.ordered}

  # PHASE 1: INTAKE
  - id: gate_no_unprompted_edits
    phase: intake
    description: Do not start editing or implementing unless the user clearly asked you to.
    type: gate
    prompt_condition: is_informational
    condition:
      metric: tool_call.file_write
      transform: count
      operator: eq
      target: 0

  # PHASE 2: INVESTIGATION
  # Note: forbid_speculation, prefer_real_source_over_guessing, and
  # gate_claims_grounded_in_inspection were removed — they rely on
  # response.code_block and response.file_path_references which require
  # parsing prose output. Deferred to Tier 2.
  - id: prereq_inspect_referenced_files
    phase: investigation
    description: If the user references a specific file/path, open and inspect it before proposing edits or explaining fixes.
    type: workflow_order
    prompt_condition: references_file_path
    condition:
      metric: tool_call.file_read
      operator: strictly_precedes
      target: tool_call.file_write
      target_args: ${file_path}

  - id: rigorous_investigation
    phase: investigation
    description: Search for key facts, conventions, and existing abstractions before making changes.
    type: constraint
    condition:
      metric: tool_call.search
      operator: exists_before
      target: tool_call.file_write

  # PHASE 3: TOOL USE (floating)
  # Note: parallelize_independent_calls and forbid_dependent_parallel_tools
  # deferred — they depend on contains_independent_args /
  # not_contains_dependent_args operators which require v1 implementation
  # (see prompt-schema.yml).
  - id: forbid_guessing_parameters
    phase: tool_use
    description: Never guess missing parameters in tool calls.
    type: constraint
    condition:
      metric: tool_call.args.file_paths
      operator: subset_of
      target: trace.known_paths

  # PHASE 4: IMPLEMENTATION
  - id: prefer_edit_over_create
    phase: implementation
    description: Prefer editing existing files over creating new ones. Read a file before creating it.
    type: workflow_order
    condition:
      metric: tool_call.file_read
      operator: precedes_per_path
      target: tool_call.file_create

  # Skipped when a new feature was explicitly requested (file creation is expected).
  - id: forbid_unprompted_file_creation
    phase: implementation
    description: Never create files unless absolutely necessary to achieve the goal.
    type: constraint
    prompt_condition: "!explicit_feature_requested"
    condition:
      metric: tool_call.file_create
      transform: count
      operator: eq
      target: 0

  - id: forbid_unprompted_docs
    phase: implementation
    description: Never proactively create documentation files (README, *.md) unless explicitly requested.
    type: constraint
    prompt_condition: "!explicit_docs_requested"
    condition:
      metric: tool_call.file_create
      operator: regex_not_match
      target: '.*\.md$'

  # PHASE 5: CLEANUP
  # Trace-only: checks that any temp file the agent created was also deleted
  # before the session ended. Does not query live workspace state.
  - id: cleanup_temporary_files
    phase: cleanup
    description: Delete any temporary helper files created during the task before finishing.
    type: constraint
    condition:
      metric: tool_call.file_create
      operator: each_matched_by
      match: '^(tmp|temp|scratch|\.tmp)[_\-.]'
      target: tool_call.file_delete

  # PHASE 6: VERIFICATION
  - id: recheck_assumptions
    phase: verification
    description: Re-check assumptions against inspected code before finishing.
    type: sequential_step
    timing: task_completed
    iteration: each
    condition:
      metric: tool_call.file_read
      operator: exists_after
      target: tool_call.file_write

  - id: verify_before_finishing
    phase: verification
    description: Run tests/commands if appropriate and available.
    type: sequential_step
    timing: task_completed
    iteration: last
    condition:
      metric: tool_call.execute_command
      operator: exists_before
      target: task_completed
      target_args: ${test_command}

  # PHASE 7: SUMMARY
  # The summary phase is retained in the ordering sequence but has no checks.
  # Content-based checks (summarize_work, summarize_files_and_changes) were
  # removed — they test output format, not behavioral compliance with a guardrail.

  # PHASE 8: COMMITS
  - id: exclude_claude_md_from_commits
    phase: commits
    description: If the user asks you to commit changes, exclude CLAUDE.md from the commit.
    type: command_adherence
    condition:
      metric: git.committed_files
      operator: not_contains
      target: CLAUDE.md

  # PHASE 9: DOCUMENTATION REFERENCE (floating)
  - id: use_docs_skill
    phase: documentation_reference
    description: When working on Claude Code features, use the /docs skill to find and reference official documentation.
    type: constraint
    prompt_condition: involves_claude_code_features
    condition:
      metric: tool_call.skill
      operator: contains
      target: docs

  # PHASE 10: SEARCH STRATEGY (floating)
  # search_broad_then_narrow: soft warning only — real debugging is accordion-
  # style, not strictly monotone. Checks first vs. last, not every step.
  - id: search_broad_then_narrow
    phase: search_strategy
    description: Start with broad searches, then narrow based on results.
    type: constraint
    severity: warning
    prompt_condition: involves_codebase_search
    condition:
      metric: tool_call.search.ordered_calls
      operator: first_search_broader_than_final

  - id: search_filter_by_type
    phase: search_strategy
    description: Filter searches by file type early to reduce noise.
    type: constraint
    prompt_condition: involves_codebase_search
    condition:
      metric: tool_call.search.args
      operator: has_key
      target: type

  - id: search_batch_patterns
    phase: search_strategy
    description: Batch related search patterns together rather than searching one at a time.
    type: constraint
    prompt_condition: involves_codebase_search
    condition:
      metric: execution.parallel_batch
      operator: contains_count_gte
      target:
        metric: tool_call.search
        count: 2

  - id: search_limit_scope
    phase: search_strategy
    description: Limit search scope to relevant directories when context allows.
    type: constraint
    prompt_condition: involves_codebase_search
    condition:
      metric: tool_call.search.args
      operator: has_key
      target: path
