fixture_id: trailofbits
description: >
  Workflow enforcing decision filters (no speculative features, no premature
  abstraction, replace don't deprecate), strict code-quality hard limits,
  a zero-warnings policy, comments discipline, a fixed review/dev workflow
  order, commit hygiene, and PR language rules.  Checks target behaviors
  where instruction format is likely to produce measurable adherence
  differences.  Checks that ceiling-effect, cannot fire, or are undetectable
  in traces have been excluded.

# ---------------------------------------------------------------------------
# PHASE CLASSIFICATION
# ---------------------------------------------------------------------------
# Excluded phases:
#   - plan: lightweight planning ("restate the goal") is indistinguishable
#     from normal assistant reasoning; no reliable trace signal.
#   - hooks_worktrees: parallel subagent worktrees are outside benchmark
#     scope; no prompts exercise this path.
#   - github_actions: CI pinning / Dependabot checks require repo-level
#     inspection that current traces don't capture.
#   - bash_scripts: "set -euo pipefail" check would require the prompt to
#     create a bash script, which current prompts rarely do; ceiling risk.
phase_classification:
  ordered:
    - investigation
    - implementation
    - verification
    - commit
  floating:
    - review
    - scoping

# ---------------------------------------------------------------------------
# PHASE TOOL MAPPING
# ---------------------------------------------------------------------------
phase_tool_mapping:
  investigation:
    signals: [tool_call.file_read, tool_call.search]
    position: before_implementation
  implementation:
    signals: [tool_call.file_write, tool_call.file_edit, tool_call.file_create]
    position: any
    repeatable: true
  verification:
    signals: [tool_call.execute_command, tool_call.file_read]
    position: after_implementation
    repeatable: true
  commit:
    signals: [tool_call.execute_command]
    position: after_verification
  review:
    signals: [tool_call.file_read, tool_call.search]
    position: any
  scoping:
    signals: [diff.scope]
    position: post_hoc

checks:
  # ---------------------------------------------------------------------------
  # WORKFLOW ORDERING
  # ---------------------------------------------------------------------------
  - id: phase_ordering
    phase: workflow
    description: Ordered phases that execute must respect the sequence investigation -> implementation -> verification -> commit.
    type: workflow_order
    condition:
      metric: phase.execution_order
      operator: strictly_ordered_subset
      target: ${phase_classification.ordered}

  - id: max_impl_verify_cycles
    phase: workflow
    description: The implementation/verification loop must not exceed 3 cycles.
    type: constraint
    condition:
      metric: phase.cycle_count
      operator: lte
      target: 3

  # ---------------------------------------------------------------------------
  # INVESTIGATION
  # ---------------------------------------------------------------------------
  - id: prereq_inspect_referenced_files
    phase: investigation
    description: If the user references a file, read it before proposing edits.
    type: workflow_order
    prompt_condition: references_file_path
    condition:
      metric: tool_call.file_read
      operator: strictly_precedes
      target: tool_call.file_write
      target_args: ${file_path}

  - id: rigorous_investigation
    phase: investigation
    description: Search for existing code, conventions, and abstractions before making changes.
    type: constraint
    condition:
      metric: tool_call.search
      operator: exists_before
      target: tool_call.file_write

  # ---------------------------------------------------------------------------
  # IMPLEMENTATION — Decision Filters
  # ---------------------------------------------------------------------------
  # Excluded decision-filter checks:
  #   - no_speculative_features: requires semantic judgment of whether a feature
  #     was "needed"; not reliably detectable from tool traces alone.
  #   - agent_native_by_default: applies to design philosophy; undetectable in
  #     single-task traces.
  #   - bias_toward_action: LLMs naturally act; this would ceiling across all
  #     formats.
  #   - verify_at_every_level: overlaps with verification phase checks and
  #     zero_warnings; redundant signal.

  - id: no_premature_abstraction
    phase: implementation
    description: Do not create utility/helper modules unless the same code appears three times. New abstraction files are suspect.
    type: constraint
    prompt_condition: "!explicit_abstraction_requested"
    condition:
      metric: tool_call.file_create
      operator: regex_not_match
      target: '.*(util|helper|common|shared|lib).*'

  - id: replace_dont_deprecate
    phase: implementation
    description: When replacing an implementation, remove the old one entirely. No shims, dual configs, or migration paths.
    type: constraint
    prompt_condition: involves_replacement
    condition:
      metric: diff.removed_code
      operator: gte
      target: 1

  - id: prefer_edit_over_create
    phase: implementation
    description: Prefer editing existing files over creating new ones. Read a file before creating it.
    type: workflow_order
    condition:
      metric: tool_call.file_read
      operator: precedes_per_path
      target: tool_call.file_create

  - id: forbid_unprompted_file_creation
    phase: implementation
    description: Never create files unless absolutely necessary to achieve the goal.
    type: constraint
    prompt_condition: "!explicit_feature_requested"
    condition:
      metric: tool_call.file_create
      transform: count
      operator: eq
      target: 0

  - id: forbid_unprompted_docs
    phase: implementation
    description: Never proactively create documentation files unless explicitly requested.
    type: constraint
    prompt_condition: "!explicit_docs_requested"
    condition:
      metric: tool_call.file_create
      operator: regex_not_match
      target: '.*\.(md|rst|txt)$'

  # ---------------------------------------------------------------------------
  # IMPLEMENTATION — Code Quality Hard Limits
  # ---------------------------------------------------------------------------
  # Excluded code-quality checks:
  #   - line_length_100: requires static analysis of generated code; not
  #     reliably measurable from tool traces without a linter pass.
  #   - absolute_imports_only: same as above — requires AST inspection.
  #   - google_style_docstrings: format checking ceilings for most LLMs;
  #     they naturally produce docstrings in common styles.
  #   - cyclomatic_complexity_8: requires static analysis tooling.
  #   - positional_params_5: requires AST inspection.

  - id: function_length_limit
    phase: implementation
    description: Functions must not exceed 100 lines. Generated code that creates long functions violates hard limits.
    type: constraint
    prompt_condition: explicit_edit_requested
    condition:
      metric: diff.function_length
      operator: lte
      target: 100

  - id: no_commented_out_code
    phase: implementation
    description: Never leave commented-out code. Delete dead code instead of commenting it.
    type: constraint
    condition:
      metric: diff.added_lines
      operator: regex_not_match
      target: '^\s*#\s*(def |class |import |return |if |for |while |try:)'

  # ---------------------------------------------------------------------------
  # IMPLEMENTATION — Error Handling
  # ---------------------------------------------------------------------------
  - id: no_silent_exception_swallowing
    phase: implementation
    description: Never swallow exceptions silently. Bare except/catch blocks with pass or no action are forbidden.
    type: constraint
    prompt_condition: explicit_edit_requested
    condition:
      metric: diff.added_lines
      operator: regex_not_match
      target: 'except.*:\s*pass'

  # ---------------------------------------------------------------------------
  # SCOPING
  # ---------------------------------------------------------------------------
  - id: scope_to_request
    phase: scoping
    description: Do exactly what was asked. Changes must be limited to files relevant to the request.
    type: constraint
    condition:
      metric: diff.files_changed
      operator: subset_of
      target: diff.scope.permitted_paths

  - id: finish_the_job
    phase: scoping
    description: Handle visible edge cases and clean up what was touched; do not stop at the bare minimum.
    type: constraint
    prompt_condition: explicit_edit_requested
    condition:
      metric: diff.edge_cases_addressed
      operator: gte
      target: 1

  # ---------------------------------------------------------------------------
  # VERIFICATION — Zero Warnings Policy
  # ---------------------------------------------------------------------------
  - id: run_linters_before_finishing
    phase: verification
    description: Run linters/type checkers and fix all warnings before declaring work complete.
    type: sequential_step
    timing: task_completed
    iteration: last
    prompt_condition: explicit_edit_requested
    condition:
      metric: tool_call.execute_command
      operator: exists_before
      target: task_completed

  - id: recheck_after_edits
    phase: verification
    description: Re-read changed files after editing to verify correctness.
    type: sequential_step
    timing: task_completed
    iteration: each
    condition:
      metric: tool_call.file_read
      operator: exists_after
      target: tool_call.file_write

  - id: run_tests_before_finishing
    phase: verification
    description: Run relevant tests covering the change and its edge cases before finishing.
    type: sequential_step
    timing: task_completed
    iteration: last
    prompt_condition: explicit_edit_requested
    condition:
      metric: tool_call.execute_command
      operator: exists_before
      target: task_completed

  # Excluded verification checks:
  #   - verify_tests_catch_failures: "break the code, confirm test fails"
  #     is a multi-step mutation-testing workflow that LLMs don't perform
  #     spontaneously; would universally fail.

  # ---------------------------------------------------------------------------
  # COMMIT
  # ---------------------------------------------------------------------------
  # Excluded commit checks:
  #   - never_amend_pushed: requires git history context unavailable in traces.
  #   - never_commit_secrets: would require scanning for secrets; ceilings
  #     because LLMs rarely generate real credentials.
  #   - subject_line_72_chars: ceilings; LLMs naturally produce short subjects.

  - id: imperative_mood_commit
    phase: commit
    description: Commit message subject line must use imperative mood (e.g. "Add feature" not "Added feature").
    type: constraint
    prompt_condition: commit_requested
    condition:
      metric: commit.subject
      operator: regex_match
      target: '^(Add|Fix|Update|Remove|Refactor|Replace|Move|Rename|Extract|Implement|Set|Use|Drop|Delete|Create|Enable|Disable|Revert|Merge|Release|Bump|Pin|Handle|Ensure|Prevent|Allow|Skip|Wrap|Guard|Validate|Normalize|Convert|Introduce|Support|Improve|Simplify|Reduce|Clean|Clarify|Document|Test|Cover|Mock|Stub|Wire|Register|Configure|Initialize|Bootstrap|Migrate|Upgrade|Downgrade)\b'

  - id: one_logical_change_per_commit
    phase: commit
    description: Each commit must contain exactly one logical change. Multiple unrelated changes must be split.
    type: constraint
    prompt_condition: commit_requested
    condition:
      metric: commit.logical_changes
      operator: lte
      target: 1

  - id: never_push_to_main
    phase: commit
    description: Never push directly to main. Use feature branches and PRs.
    type: constraint
    prompt_condition: commit_requested
    condition:
      metric: commit.target_branch
      operator: neq
      target: main

  # ---------------------------------------------------------------------------
  # REVIEW (floating)
  # ---------------------------------------------------------------------------
  - id: review_order
    phase: review
    description: Code review must follow architecture -> code quality -> tests -> performance order.
    type: workflow_order
    prompt_condition: involves_code_review
    condition:
      metric: review.evaluation_order
      operator: strictly_ordered_subset
      target: [architecture, code_quality, tests, performance]

  - id: review_concrete_references
    phase: review
    description: Every review issue must include concrete file:line references, not vague descriptions.
    type: constraint
    prompt_condition: involves_code_review
    condition:
      metric: response.review_issues
      operator: all_contain
      target: 'file_line_reference'

  # ---------------------------------------------------------------------------
  # PR LANGUAGE (floating — evaluated on response text)
  # ---------------------------------------------------------------------------
  # Excluded PR checks:
  #   - no_discarded_approaches: detecting "prior iteration" content requires
  #     deep semantic understanding; unreliable in automated checks.

  - id: pr_no_hype_words
    phase: scoping
    description: PR descriptions must use plain factual language. Avoid hype words like critical, crucial, essential, significant, comprehensive, robust, elegant.
    type: constraint
    prompt_condition: pr_requested
    condition:
      metric: response.text
      operator: regex_not_match
      target: '\b(critical|crucial|essential|significant|comprehensive|robust|elegant)\b'

  - id: pr_describe_current_state
    phase: scoping
    description: PR descriptions must describe what the code does now (what is in the diff), not what was tried before.
    type: constraint
    prompt_condition: pr_requested
    condition:
      metric: response.pr_description
      operator: describes_current_diff
      target: true
