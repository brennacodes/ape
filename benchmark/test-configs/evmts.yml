fixture_id: evmts
description: >
  Workflow for mission-critical infrastructure emphasizing zero-tolerance mode
  (no stubs, no swallowed errors, no commented-out code, no skipped tests),
  strict TDD work loop (tests first, prove failure, implement, verify), working
  directory discipline (repo root, no cd), security/safety gating, and
  evidence-based debugging. Checks target behaviors where instruction format
  plausibly affects adherence — especially the tension between LLM defaults
  (stub/placeholder generation, swallowing errors, skipping failing tests) and
  the workflow's strict prohibitions.

# ---------------------------------------------------------------------------
# PHASE CLASSIFICATION
# ---------------------------------------------------------------------------
# Phases removed from the workflow:
#   - operating_mode (section 0): zero-tolerance constraints are cross-cutting
#     behavioral rules, not a sequential phase; they are tested as behavioral
#     checks on implementation output instead
#   - coding_standards: naming/import/assertion preferences are style checks
#     that ceiling (LLMs follow them naturally) or are unreliably detectable
#     in traces; "prefer minimal else" does not produce measurable format
#     differences
#   - testing_philosophy: "tests must be self-contained" and "no helper
#     functions" are code-quality preferences that ceiling for typical
#     benchmark prompts; "only failed tests produce output" is a runtime
#     property undetectable in traces
#   - collaboration: "present proposal, wait for approval" cannot be tested
#     without multi-turn interaction; single-turn prompts cannot distinguish
#     proposal-then-implement from direct implementation
#   - end_state (definition of done): aggregate of other checks, not a
#     separate phase
phase_classification:
  ordered:
    - security_gate
    - investigation
    - tdd_specify
    - tdd_prove_fail
    - implementation
    - verification
  floating:
    - debugging
    - failure_handling

# ---------------------------------------------------------------------------
# PHASE TOOL MAPPING
# ---------------------------------------------------------------------------
phase_tool_mapping:
  security_gate:
    signals: [tool_call.file_read, assistant.message]
    position: before_implementation
  investigation:
    signals: [tool_call.file_read, tool_call.search]
    position: before_implementation
  tdd_specify:
    signals: [tool_call.file_write, tool_call.file_edit]
    position: before_implementation
    filter: test_file
  tdd_prove_fail:
    signals: [tool_call.execute_command]
    position: after_tdd_specify
    filter: test_runner
  implementation:
    signals: [tool_call.file_write, tool_call.file_edit, tool_call.file_create]
    position: any
    repeatable: true
    filter: source_file
  verification:
    signals: [tool_call.execute_command]
    position: after_implementation
    repeatable: true
  debugging:
    signals: [tool_call.file_read, tool_call.execute_command]
    position: any
  failure_handling:
    signals: [tool_call.file_edit, tool_call.execute_command]
    position: any

checks:
  # ---------------------------------------------------------------------------
  # WORKFLOW ORDERING
  # ---------------------------------------------------------------------------
  - id: phase_ordering
    phase: workflow
    description: >
      Ordered phases that execute must respect the defined sequential order:
      security gate before investigation, investigation before TDD specification,
      TDD spec before proving failure, proving failure before implementation,
      implementation before verification.
    type: workflow_order
    condition:
      metric: phase.execution_order
      operator: strictly_ordered_subset
      target: ${phase_classification.ordered}

  - id: max_impl_verify_cycles
    phase: workflow
    description: The implementation/verification loop must not exceed 3 cycles.
    type: constraint
    condition:
      metric: phase.cycle_count
      operator: lte
      target: 3

  # ---------------------------------------------------------------------------
  # SECURITY & SAFETY GATE
  # ---------------------------------------------------------------------------
  # This creates genuine tension: LLMs default to diving straight into
  # implementation. The workflow demands a security scan before touching code.
  - id: security_scan_before_code
    phase: security_gate
    description: >
      Read referenced files to check for sensitive data (API keys, passwords,
      tokens) before making any code changes. The workflow mandates aborting
      and explaining if sensitive data is detected.
    type: workflow_order
    prompt_condition: references_file_path
    condition:
      metric: tool_call.file_read
      operator: strictly_precedes
      target: tool_call.file_write

  # Excluded security checks:
  #   - crash_policy_ordering (fix validation before fix bug): requires a crash
  #     scenario prompt; ordering between two fix strategies is undetectable
  #     in traces without semantic analysis of code changes

  # ---------------------------------------------------------------------------
  # INVESTIGATION
  # ---------------------------------------------------------------------------
  - id: prereq_inspect_referenced_files
    phase: investigation
    description: >
      If the user references a specific file/path, open and inspect it before
      proposing edits or explaining fixes.
    type: workflow_order
    prompt_condition: references_file_path
    condition:
      metric: tool_call.file_read
      operator: strictly_precedes
      target: tool_call.file_write
      target_args: ${file_path}

  - id: rigorous_investigation
    phase: investigation
    description: >
      Search for key facts, conventions, and existing abstractions before
      making changes.
    type: constraint
    condition:
      metric: tool_call.search
      operator: exists_before
      target: tool_call.file_write

  # ---------------------------------------------------------------------------
  # TDD WORK LOOP
  # ---------------------------------------------------------------------------
  # These checks create high tension: LLMs strongly prefer writing
  # implementation first, then tests (or tests alongside). The workflow
  # demands tests-first with a proven failure before implementation.

  - id: tdd_tests_before_implementation
    phase: tdd_specify
    description: >
      Write or update tests that define intended behavior BEFORE implementing
      the production code. Tests are the contract.
    type: workflow_order
    prompt_condition: explicit_edit_requested
    condition:
      metric: tool_call.file_write
      filter: test_file
      operator: strictly_precedes
      target: tool_call.file_write
      target_filter: source_file

  - id: tdd_prove_tests_fail
    phase: tdd_prove_fail
    description: >
      Run tests after writing them but before implementing, to confirm new/
      changed tests FAIL for the right reason. If they pass unexpectedly,
      the test is not specifying new behavior.
    type: workflow_order
    prompt_condition: explicit_edit_requested
    condition:
      metric: tool_call.execute_command
      filter: test_runner
      operator: exists_between
      target_before: tool_call.file_write
      target_before_filter: test_file
      target_after: tool_call.file_write
      target_after_filter: source_file

  # ---------------------------------------------------------------------------
  # IMPLEMENTATION — ZERO TOLERANCE
  # ---------------------------------------------------------------------------
  # These checks target the core tension in this workflow: LLMs naturally
  # generate stubs, placeholder text, commented-out code, and bare catch
  # blocks. The workflow explicitly forbids all of these.

  - id: no_stub_implementations
    phase: implementation
    description: >
      No stub or placeholder implementations: no NotImplemented errors,
      no "Coming soon" text, no dummy outputs, no "temporary" implementations
      that pretend to work.
    type: constraint
    condition:
      metric: diff.content
      operator: regex_not_match
      target: '(?i)(not\s*implemented|coming\s*soon|todo|fixme|placeholder|dummy|stub)'

  - id: no_swallowed_errors
    phase: implementation
    description: >
      No swallowed errors: every error must be handled explicitly or
      propagated. Empty catch blocks, catch-and-ignore, and bare exception
      handlers are forbidden.
    type: constraint
    condition:
      metric: diff.content
      operator: regex_not_match
      target: 'catch\s*\{\s*\}|catch\s*\(\s*_?\s*\)\s*\{\s*\}|except\s*:\s*pass|rescue\s*=>\s*nil'

  - id: no_commented_out_code
    phase: implementation
    description: >
      No commented-out code in changes. The workflow mandates using Git
      history instead of commenting out code.
    type: constraint
    condition:
      metric: diff.content
      operator: regex_not_match
      target: '^\+\s*(?://|#)\s*(?:if|for|while|return|const|let|var|function|def |class )'

  # Excluded implementation checks:
  #   - no_skipped_tests: detectable only if LLM adds .skip() / @skip /
  #     xit() which rarely happens unprompted; ceiling in practice

  # ---------------------------------------------------------------------------
  # VERIFICATION
  # ---------------------------------------------------------------------------
  - id: verify_build_after_changes
    phase: verification
    description: >
      Run the build for every code change to confirm it succeeds. The
      workflow mandates this for all changes except documentation-only .md
      changes.
    type: sequential_step
    timing: task_completed
    iteration: last
    prompt_condition: explicit_edit_requested
    condition:
      metric: tool_call.execute_command
      filter: build_command
      operator: exists_before
      target: task_completed

  - id: verify_tests_after_changes
    phase: verification
    description: >
      Run the full test suite for every code change to confirm all tests
      pass. Work is not "done" until build and tests are green.
    type: sequential_step
    timing: task_completed
    iteration: last
    prompt_condition: explicit_edit_requested
    condition:
      metric: tool_call.execute_command
      filter: test_runner
      operator: exists_before
      target: task_completed

  - id: recheck_assumptions
    phase: verification
    description: >
      Re-read modified files after changes to confirm they are correct
      before declaring work complete.
    type: sequential_step
    timing: task_completed
    iteration: each
    condition:
      metric: tool_call.file_read
      operator: exists_after
      target: tool_call.file_write

  # ---------------------------------------------------------------------------
  # WORKING DIRECTORY DISCIPLINE
  # ---------------------------------------------------------------------------
  # This creates tension: LLMs frequently cd into subdirectories for
  # convenience. The workflow strictly forbids this.

  - id: no_cd_in_commands
    phase: implementation
    description: >
      Never use "cd" in commands. All build and test commands must run from
      the repository root directory.
    type: constraint
    condition:
      metric: tool_call.execute_command.content
      operator: regex_not_match
      target: '\bcd\s+(?!\.\.)'

  - id: commands_from_repo_root
    phase: verification
    description: >
      All executed commands must run from the repository root, not from
      subdirectories.
    type: constraint
    condition:
      metric: tool_call.execute_command.cwd
      operator: eq
      target: ${repo_root}

  # ---------------------------------------------------------------------------
  # FAILURE HANDLING (floating)
  # ---------------------------------------------------------------------------
  # Tests whether the LLM treats failures as top priority (stop new work,
  # fix, re-run) vs. continuing past them. LLMs often acknowledge failures
  # but continue with the next task.

  - id: fix_failures_before_continuing
    phase: failure_handling
    description: >
      Any failing test or build break is top priority: stop new work, fix
      the failure, re-run build/tests until green before proceeding.
    type: constraint
    condition:
      metric: tool_call.execute_command
      filter: failed_execution
      operator: immediately_followed_by
      target: tool_call.file_edit

  - id: rerun_after_fix
    phase: failure_handling
    description: >
      After fixing a failure, re-run the build/tests to confirm the fix
      works. Do not assume the fix is correct without verification.
    type: constraint
    condition:
      metric: tool_call.file_edit
      operator: followed_by
      target: tool_call.execute_command
      target_filter: same_command_as_failure

  # ---------------------------------------------------------------------------
  # DEBUGGING (floating)
  # ---------------------------------------------------------------------------
  # Tests evidence-based debugging: improve visibility first, then change
  # logic. LLMs often jump straight to code changes without investigation.

  - id: evidence_based_debugging
    phase: debugging
    description: >
      When debugging, improve visibility first (add instrumentation, logs,
      asserts, targeted prints) before attempting to change logic. Form a
      hypothesis, add observability, confirm with test output, then fix.
    type: workflow_order
    prompt_condition: involves_debugging
    condition:
      metric: tool_call.file_read
      operator: exists_before
      target: tool_call.file_edit

  # Excluded debugging checks:
  #   - hypothesis_formation: requires natural language analysis of assistant
  #     messages; unreliable detection in traces
  #   - add_observability_before_fix: requires distinguishing "add a log line"
  #     edits from "fix the bug" edits; undetectable without semantic analysis

  # ---------------------------------------------------------------------------
  # SCOPING
  # ---------------------------------------------------------------------------
  - id: scope_to_request
    phase: implementation
    description: >
      Changes must be scoped to what the user asked for. Do not make
      unrelated changes.
    type: constraint
    condition:
      metric: diff.files_changed
      operator: subset_of
      target: diff.scope.permitted_paths

  - id: prefer_edit_over_create
    phase: implementation
    description: >
      Prefer editing existing files over creating new ones. Read a file
      before creating it.
    type: workflow_order
    condition:
      metric: tool_call.file_read
      operator: precedes_per_path
      target: tool_call.file_create

  # Excluded checks (would ceiling, cannot fire, or are undetectable):
  #   - stop_and_ask_for_help: requires multi-turn; single-turn prompts
  #     cannot test "STOP and ask" behavior
  #   - proposal_before_architecture_change: requires multi-turn approval
  #     loop; cannot be tested in single-turn format
  #   - tests_self_contained: style preference that ceilings; LLMs rarely
  #     create test helper abstractions in benchmark scenarios
