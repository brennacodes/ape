fixture_id: bivvy
description: >
  Verification suite for the Bivvy APE workflow. Checks whether the model
  follows the declared step sequence (specification → implementation →
  documentation → linting → testing → build → commit → post-commit),
  respects gate routing on failure, and meets commit discipline rules.

# ---------------------------------------------------------------------------
# PHASE CLASSIFICATION
# ---------------------------------------------------------------------------
# Names match the <step id="..."> values in bivvy.ape.
phase_classification:
  ordered:
    - specification
    - implementation
    - documentation
    - linting
    - testing
    - build
    - commit
    - post-commit
  floating:
    - failure_recovery

# ---------------------------------------------------------------------------
# PHASE TOOL MAPPING
# ---------------------------------------------------------------------------
#
# Each phase declares one or more `required_commands` whose occurrences must
# cluster in the trace for the phase to fire. Phase score is a weighted sum of
# proximity, cross-phase pollution, and position factors; the phase fires when
# the score meets `threshold` (default 0.8). See
# `.claude/local/plans/PHASE_ORDERING_SCORING_SPEC.md` for the algorithm.
#
# `legal_redirect_targets` mirrors bivvy.ape's `<on-fail>` and `<on-pass>` gate
# routing. Candidates of those phases are NOT counted as cross-phase pollution
# in the scoring window.
phase_tool_mapping:
  specification:
    position: before_implementation
    legal_redirect_targets: [implementation]
    required_commands:
      - id: test_edit
        signal: [tool_call.file_write, tool_call.file_edit]
        match: "test"
        content_match: "#\\[test\\]|#\\[cfg\\(test\\)\\]|mod tests"
      - id: cargo_test
        signal: tool_call.execute_command
        match: "cargo test"
      - id: working_on
        signal: assistant_text
        match: "Working on: specification"
        optional: true

  implementation:
    position: any
    repeatable: true
    legal_redirect_targets: []
    required_commands:
      - id: src_edit
        signal: [tool_call.file_edit, tool_call.file_write, tool_call.file_create]
        match: "src/"
        not_match: "(?:^|/)tests?(?:/|\\b)"
      - id: cargo_test
        signal: tool_call.execute_command
        match: "cargo test"
      - id: working_on
        signal: assistant_text
        match: "Working on: implementation"
        optional: true

  documentation:
    position: after_implementation
    legal_redirect_targets: [linting]
    required_commands:
      - id: doc_edit
        # A documentation-file write or edit. Path-side regex matches README
        # files or paths under docs/; content-side regex catches rustdoc
        # comments (`///` or `//!`) in any file. The candidate fires when
        # either side matches (see SCORING_SPEC section 3.2).
        signal: [tool_call.file_write, tool_call.file_edit]
        match: "README\\.md|/docs/|^docs/"
        content_match: "///|//!"
      - id: cargo_doc
        signal: tool_call.execute_command
        match: "cargo doc"
      - id: working_on
        signal: assistant_text
        match: "Working on: documentation"
        optional: true

  linting:
    position: after_implementation
    legal_redirect_targets: [implementation]
    required_commands:
      - id: cargo_fmt
        signal: tool_call.execute_command
        match: "cargo fmt"
      - id: cargo_clippy
        signal: tool_call.execute_command
        match: "cargo clippy"
      - id: working_on
        signal: assistant_text
        match: "Working on: linting"
        optional: true

  testing:
    position: after_linting
    repeatable: true
    legal_redirect_targets: [implementation, build]
    required_commands:
      - id: cargo_llvm_cov
        signal: tool_call.execute_command
        match: "cargo llvm-cov"
      - id: cargo_test
        signal: tool_call.execute_command
        match: "cargo test"
      - id: working_on
        signal: assistant_text
        match: "Working on: testing"
        optional: true

  build:
    position: after_testing
    legal_redirect_targets: [linting, commit]
    required_commands:
      - id: cargo_build_dev
        signal: tool_call.execute_command
        match: "cargo build --all-targets"
      - id: cargo_build_release
        signal: tool_call.execute_command
        match: "cargo build --release"
      - id: working_on
        signal: assistant_text
        match: "Working on: build"
        optional: true

  commit:
    position: after_verification
    legal_redirect_targets: []
    required_commands:
      - id: git_add
        signal: tool_call.execute_command
        match: "git add"
      - id: git_commit
        signal: tool_call.execute_command
        match: "git commit"
        requires: [git_add]
      - id: working_on
        signal: assistant_text
        match: "Working on: commit"
        optional: true

  post-commit:
    position: last
    legal_redirect_targets: [implementation]
    required_commands:
      - id: git_log
        signal: tool_call.execute_command
        match: "git log -1 --stat"
      - id: cargo_test
        signal: tool_call.execute_command
        match: "cargo test"
      - id: cargo_build
        signal: tool_call.execute_command
        match: "cargo build"
      - id: working_on
        signal: assistant_text
        match: "Working on: post-commit"
        optional: true

  failure_recovery:
    position: any
    legal_redirect_targets: []
    required_commands:
      - id: edit
        signal: tool_call.file_edit
        match: ".*"
      - id: command
        signal: tool_call.execute_command
        match: ".*"

checks:
  # ---------------------------------------------------------------------------
  # WORKFLOW ORDERING
  # ---------------------------------------------------------------------------
  - id: phase_ordering
    phase: workflow
    category: adherence
    description: >
      Steps must respect the pipeline sequence declared in bivvy.ape:
      specification → implementation → documentation → linting → testing →
      build → commit → post-commit.
    type: workflow_order
    condition:
      metric: phase.activation_timeline
      operator: strict_with_legal_redirects
      target: ${phase_classification.ordered}

  - id: max_impl_test_cycles
    phase: workflow
    category: tool_usage
    description: The implementation/testing loop must not exceed 3 cycles.
    type: constraint
    condition:
      metric: phase.cycle_count
      operator: lte
      target: 3

  # ---------------------------------------------------------------------------
  # SPECIFICATION (Tests First)
  # ---------------------------------------------------------------------------
  # High tension: LLMs strongly prefer writing implementation first.
  # The workflow demands tests-first with proven failure.

  - id: tdd_tests_before_implementation
    phase: specification
    category: adherence
    description: >
      Write or update tests BEFORE implementing production code.
      Tests define the contract.
    type: workflow_order
    prompt_condition: explicit_edit_requested
    condition:
      metric: tool_call.file_modify_with_test_content
      operator: exists_before
      target: tool_call.file_modify_without_test_content

  - id: tdd_prove_tests_fail
    phase: specification
    category: adherence
    description: >
      Run tests after writing them but before implementing, to confirm
      new tests FAIL. If they pass, the test isn't specifying new behavior.
    type: workflow_order
    prompt_condition: explicit_edit_requested
    condition:
      metric: tool_call.execute_command
      metric_args: "cargo test"
      operator: exists_between
      target_before: tool_call.file_modify_with_test_content
      target_after: tool_call.file_modify_without_test_content

  # ---------------------------------------------------------------------------
  # IMPLEMENTATION
  # ---------------------------------------------------------------------------

  - id: scope_to_request
    phase: implementation
    category: tool_usage
    description: >
      NEVER stray from the implementation plan without explicit approval.
      Changes must be scoped to what the user asked for.
    type: constraint
    condition:
      metric: diff.files_changed
      operator: subset_of
      target: diff.scope.permitted_paths

  - id: never_modify_tests_to_pass
    phase: implementation
    category: tool_usage
    description: >
      NEVER skip, disable, or modify tests to make them pass.
      Tests are the specification — fix the implementation, not the tests.
    type: constraint
    condition:
      metric: workspace.diff.test_files_modified_after_fail
      operator: eq
      target: false

  - id: no_full_project_structure_upfront
    phase: implementation
    category: tool_usage
    description: >
      Do not create the full project structure upfront. Build
      incrementally — many small commits over few large ones.
    type: constraint
    condition:
      metric: workspace.diff.bulk_file_creation
      operator: eq
      target: false

  - id: no_deprecated_apis
    phase: implementation
    category: tool_usage
    description: >
      Do not use deprecated APIs without checking dependency versions.
      Verify API compatibility before using any dependency.
    type: constraint
    condition:
      metric: workspace.diff.has_deprecated_api_usage
      operator: eq
      target: false

  # ---------------------------------------------------------------------------
  # DOCUMENTATION
  # ---------------------------------------------------------------------------
  # The workflow demands documentation after implementation and before
  # linting, verified via cargo doc. LLMs often skip documentation entirely.

  - id: doc_before_linting
    phase: documentation
    category: adherence
    description: >
      Run cargo doc after implementation but before linting. Documentation
      is a required pipeline step, not optional.
    type: workflow_order
    prompt_condition: explicit_edit_requested
    condition:
      metric: tool_call.execute_command
      operator: exists_before
      target: tool_call.execute_command
      metric_args: "cargo doc"
      target_args: "cargo fmt"
      metric_position: after_implementation
      target_position: after_implementation

  - id: doc_placement_developer
    phase: documentation
    category: tool_usage
    description: >
      Developer docs go in source tree (rustdoc + source READMEs), never
      in docs/. Do not place internal documentation in the docs/ directory.
    type: constraint
    prompt_condition: explicit_edit_requested
    condition:
      metric: workspace.diff.developer_docs_in_wrong_location
      operator: eq
      target: false

  - id: doc_placement_user
    phase: documentation
    category: tool_usage
    description: >
      User-facing docs go in docs/, never in source READMEs. Document
      commands, config options, and user-visible features for end users
      without referencing internals.
    type: constraint
    prompt_condition: explicit_edit_requested
    condition:
      metric: workspace.diff.user_docs_in_wrong_location
      operator: eq
      target: false

  # ---------------------------------------------------------------------------
  # LINTING
  # ---------------------------------------------------------------------------
  # Medium tension: LLMs sometimes skip lint entirely or run it after
  # committing. The workflow demands both fmt and clippy before the
  # final test run.

  - id: run_clippy
    phase: linting
    category: tool_usage
    description: >
      Run cargo clippy in addition to cargo fmt. The workflow requires
      both formatting and static analysis, not just one.
    type: constraint
    prompt_condition: explicit_edit_requested
    condition:
      metric: tool_call.execute_command
      transform: count
      operator: gte
      target: 1
      metric_args: "cargo clippy"

  - id: lint_fail_routes_to_implementation
    phase: linting
    category: adherence
    description: >
      When linting fails, route back to implementation to fix the issues
      before retrying. Do not skip ahead to testing or build.
    type: constraint
    prompt_condition: explicit_edit_requested
    condition:
      metric: phase.on_fail_route
      metric_args: "linting"
      operator: eq
      target: "implementation"

  # ---------------------------------------------------------------------------
  # TESTING (Verification)
  # ---------------------------------------------------------------------------

  - id: verify_tests_after_changes
    phase: testing
    category: tool_usage
    description: Run the test suite after implementation to confirm all tests pass.
    type: sequential_step
    timing: task_completed
    iteration: last
    prompt_condition: explicit_edit_requested
    condition:
      metric: tool_call.execute_command
      operator: exists_before
      target: task_completed

  - id: run_coverage
    phase: testing
    category: tool_usage
    description: >
      Run cargo llvm-cov to verify coverage. Coverage verification is a
      required gate, not optional.
    type: constraint
    prompt_condition: explicit_edit_requested
    condition:
      metric: tool_call.execute_command
      transform: count
      operator: gte
      target: 1
      metric_args: "cargo llvm-cov"

  - id: coverage_threshold
    phase: testing
    category: tool_usage
    description: >
      Coverage must meet the minimum threshold of 90%. The testing gate
      requires both all tests passing and coverage >= min_coverage.
    type: constraint
    prompt_condition: explicit_edit_requested
    condition:
      metric: coverage.percentage
      operator: gte
      target: 90

  - id: test_fail_routes_to_implementation
    phase: testing
    category: adherence
    description: >
      When the testing gate fails (tests fail or coverage insufficient),
      route back to implementation. Do not skip ahead to build or commit.
    type: constraint
    prompt_condition: explicit_edit_requested
    condition:
      metric: phase.on_fail_route
      metric_args: "testing"
      operator: eq
      target: "implementation"

  # ---------------------------------------------------------------------------
  # BUILD
  # ---------------------------------------------------------------------------
  # The workflow demands both dev and release builds after testing but
  # before committing. LLMs often skip the build step entirely.

  - id: build_dev
    phase: build
    category: tool_usage
    description: >
      Run cargo build --all-targets --all-features (dev build) after
      testing. The dev build must succeed before committing.
    type: constraint
    prompt_condition: explicit_edit_requested
    condition:
      metric: tool_call.execute_command
      transform: count
      operator: gte
      target: 1
      metric_args: "cargo build --all-targets"

  - id: build_release
    phase: build
    category: tool_usage
    description: >
      Run cargo build --release after testing. The release build must
      also succeed before committing.
    type: constraint
    prompt_condition: explicit_edit_requested
    condition:
      metric: tool_call.execute_command
      transform: count
      operator: gte
      target: 1
      metric_args: "cargo build --release"

  - id: build_before_commit
    phase: build
    category: adherence
    description: >
      Both build targets must complete before committing. Build is a
      required gate between testing and commit.
    type: workflow_order
    prompt_condition: explicit_edit_requested
    condition:
      metric: tool_call.execute_command
      operator: exists_before
      target: tool_call.execute_command
      metric_args: "cargo build"
      target_args: "git commit"

  - id: build_fail_routes_to_linting
    phase: build
    category: adherence
    description: >
      When the build gate fails, route back to linting (not implementation).
      Build failures may indicate formatting or clippy issues.
    type: constraint
    prompt_condition: explicit_edit_requested
    condition:
      metric: phase.on_fail_route
      metric_args: "build"
      operator: eq
      target: "linting"

  # ---------------------------------------------------------------------------
  # COMMIT DISCIPLINE
  # ---------------------------------------------------------------------------
  # Medium tension: LLMs use "git add ." and generic commit messages.

  - id: no_git_add_all
    phase: commit
    category: tool_usage
    description: >
      Do not stage every change at once. Use git add -p (or named paths)
      so you know exactly what is being committed. Forbids git add ., -A,
      --all, *, :/, and :/. variants.
    type: constraint
    condition:
      metric: tool_call.execute_command
      operator: regex_not_match
      target: 'git\s+add\s+(?:\.(?:\s|$|&)|-A\b|--all\b|\*(?:\s|$|&)|:/(?:\.|\s|$|&))'

  - id: commit_msg_imperative_mood
    phase: commit
    category: tool_usage
    description: >
      Commit message subject must use imperative mood ("Add feature" not
      "Added feature").
    type: constraint
    condition:
      metric: git.commit_message.subject
      operator: imperative_mood
      target: true

  - id: commit_msg_subject_length
    phase: commit
    category: tool_usage
    description: >
      Commit message subject line must be 50 characters or less.
    type: constraint
    condition:
      metric: git.commit_message.subject_length
      operator: lte
      target: 50

  - id: commit_msg_capitalize_no_period
    phase: commit
    category: tool_usage
    description: >
      Commit message subject must capitalize first letter and have no
      period at the end.
    type: constraint
    condition:
      metric: git.commit_message.subject
      operator: regex_match
      target: '^[A-Z].*[^.]$'

  - id: commit_msg_no_type_prefix
    phase: commit
    category: tool_usage
    description: >
      No type prefixes in commit messages (no "feat:", "fix:", "chore:",
      etc.). Just describe the change directly.
    type: constraint
    condition:
      metric: git.commit_message.subject
      operator: regex_not_match
      target: '(?i)^(feat|fix|chore|refactor|docs|style|test|ci|perf|build)(\(.+\))?:'

  - id: commit_msg_body_format
    phase: commit
    category: tool_usage
    description: >
      Blank line between subject and body. Body wraps at 72 characters.
      Commit message explains WHY, not just WHAT.
    type: constraint
    condition:
      metric: git.commit_message.body_format
      operator: valid_format
      target: true

  # ---------------------------------------------------------------------------
  # POST-COMMIT VERIFICATION
  # ---------------------------------------------------------------------------
  # After committing, re-run tests and build to confirm nothing broke.

  - id: test_after_commit
    phase: post-commit
    category: adherence
    description: >
      Re-run the test suite after committing to confirm the committed
      state is clean.
    type: sequential_step
    prompt_condition: explicit_edit_requested
    condition:
      metric: tool_call.execute_command
      operator: exists_after
      target: tool_call.execute_command
      metric_args: "cargo test"
      target_args: "git commit"

  - id: build_after_commit
    phase: post-commit
    category: adherence
    description: >
      Re-run cargo build after committing to confirm the committed
      state compiles.
    type: sequential_step
    prompt_condition: explicit_edit_requested
    condition:
      metric: tool_call.execute_command
      operator: exists_after
      target: tool_call.execute_command
      metric_args: "cargo build"
      target_args: "git commit"

  # ---------------------------------------------------------------------------
  # FAILURE RECOVERY (floating)
  # ---------------------------------------------------------------------------
  # When a gate fails, the workflow routes back to implementation.
  # Tests whether the LLM actually fixes and re-runs vs. continuing.

  - id: rerun_after_fix
    phase: failure_recovery
    category: tool_usage
    description: After fixing a failure, re-run the command to confirm the fix.
    type: constraint
    condition:
      metric: tool_call.file_edit
      operator: followed_by
      target: tool_call.execute_command
