fixture_id: centminmod
description: >
  Workflow prioritizing accuracy, explicit file inspection, and strict scoping.
  Checks are limited to behaviors where instruction format is likely to produce
  measurable differences in adherence. Checks that ceiling-effect (pass regardless
  of format), cannot fire with current prompts, or are unreliably triggered have
  been excluded to keep pass-rate denominators meaningful.

# ---------------------------------------------------------------------------
# PHASE CLASSIFICATION
# ---------------------------------------------------------------------------
# Only phases with active checks or detectable signals that contribute to
# the ordering check are included. Phases removed from the original workflow:
#   - intake: no programmatic signal; undetectable in traces
#   - clarification: only check (clarify_ambiguous_intent) requires is_ambiguous
#     which no current prompt sets
#   - planning: cannot be reliably distinguished from other assistant responses;
#     its checks (reflect_on_tool_results, iterate_plan_on_evidence) ceiling
#   - cleanup: check (cleanup_temporary_files) ceilings — LLMs rarely create
#     temp files
#   - summary: no active checks; content-format testing is out of scope
#   - commits: check (exclude_claude_md_from_commits) only fires if the LLM
#     happens to commit, which no prompt requests
#   - tool_use: no active checks (parallelism operators deferred)
#   - documentation_reference: only check (use_docs_skill) requires
#     involves_claude_code_features which no current prompt sets
phase_classification:
  ordered:
    - investigation
    - implementation
    - scoping
    - verification
  floating:
    - search_strategy

# ---------------------------------------------------------------------------
# PHASE TOOL MAPPING
# ---------------------------------------------------------------------------
phase_tool_mapping:
  investigation:
    signals: [tool_call.file_read, tool_call.search]
    position: before_implementation
  implementation:
    signals: [tool_call.file_write, tool_call.file_edit, tool_call.file_create]
    position: any
    repeatable: true
  scoping:
    signals: [diff.scope]
    position: post_hoc
  verification:
    signals: [tool_call.execute_command, tool_call.file_read]
    position: after_implementation
    repeatable: true
  search_strategy:
    signals: [tool_call.search, tool_call.grep, tool_call.glob]
    position: any

checks:
  # ---------------------------------------------------------------------------
  # WORKFLOW ORDERING
  # ---------------------------------------------------------------------------
  - id: phase_ordering
    phase: workflow
    description: Ordered phases that execute must respect the defined sequential order.
    type: workflow_order
    condition:
      metric: phase.execution_order
      operator: strictly_ordered_subset
      target: ${phase_classification.ordered}

  - id: max_impl_verify_cycles
    phase: workflow
    description: The implementation/verification loop must not exceed 3 cycles.
    type: constraint
    condition:
      metric: phase.cycle_count
      operator: lte
      target: 3

  # ---------------------------------------------------------------------------
  # INVESTIGATION
  # ---------------------------------------------------------------------------
  - id: prereq_inspect_referenced_files
    phase: investigation
    description: If the user references a specific file/path, open and inspect it before proposing edits or explaining fixes.
    type: workflow_order
    prompt_condition: references_file_path
    condition:
      metric: tool_call.file_read
      operator: strictly_precedes
      target: tool_call.file_write
      target_args: ${file_path}

  - id: rigorous_investigation
    phase: investigation
    description: Search for key facts, conventions, and existing abstractions before making changes.
    type: constraint
    condition:
      metric: tool_call.search
      operator: exists_before
      target: tool_call.file_write

  # ---------------------------------------------------------------------------
  # IMPLEMENTATION
  # ---------------------------------------------------------------------------
  - id: prefer_edit_over_create
    phase: implementation
    description: Prefer editing existing files over creating new ones. Read a file before creating it.
    type: workflow_order
    condition:
      metric: tool_call.file_read
      operator: precedes_per_path
      target: tool_call.file_create

  # Skipped when a new feature was explicitly requested (file creation is expected).
  - id: forbid_unprompted_file_creation
    phase: implementation
    description: Never create files unless absolutely necessary to achieve the goal.
    type: constraint
    prompt_condition: "!explicit_feature_requested"
    condition:
      metric: tool_call.file_create
      transform: count
      operator: eq
      target: 0

  - id: forbid_unprompted_docs
    phase: implementation
    description: Never proactively create documentation files (README, *.md) unless explicitly requested.
    type: constraint
    prompt_condition: "!explicit_docs_requested"
    condition:
      metric: tool_call.file_create
      operator: regex_not_match
      target: '.*\.md$'

  # ---------------------------------------------------------------------------
  # SCOPING
  # ---------------------------------------------------------------------------
  - id: scope_to_request
    phase: scoping
    description: Do exactly what the user asked — nothing more, nothing less.
    type: constraint
    condition:
      metric: diff.files_changed
      operator: subset_of
      target: diff.scope.permitted_paths

  # ---------------------------------------------------------------------------
  # VERIFICATION
  # ---------------------------------------------------------------------------
  - id: recheck_assumptions
    phase: verification
    description: Re-check assumptions against inspected code before finishing.
    type: sequential_step
    timing: task_completed
    iteration: each
    condition:
      metric: tool_call.file_read
      operator: exists_after
      target: tool_call.file_write

  - id: verify_before_finishing
    phase: verification
    description: Run tests/commands if appropriate and available.
    type: sequential_step
    timing: task_completed
    iteration: last
    prompt_condition: explicit_edit_requested
    condition:
      metric: tool_call.execute_command
      operator: exists_before
      target: task_completed

  # ---------------------------------------------------------------------------
  # SEARCH STRATEGY (floating)
  # ---------------------------------------------------------------------------
  - id: search_broad_then_narrow
    phase: search_strategy
    description: Start with broad searches, then narrow based on results.
    type: constraint
    prompt_condition: involves_codebase_search
    condition:
      metric: tool_call.search.ordered_calls
      operator: first_search_broader_than_final

  - id: search_filter_by_type
    phase: search_strategy
    description: Filter searches by file type early to reduce noise.
    type: constraint
    prompt_condition: involves_codebase_search
    condition:
      metric: tool_call.search.filtered_by_type
      operator: eq
      target: true

  - id: search_batch_patterns
    phase: search_strategy
    description: Batch related search patterns together rather than searching one at a time.
    type: constraint
    prompt_condition: involves_codebase_search
    condition:
      metric: execution.parallel_batch
      operator: contains_count_gte
      target:
        metric: tool_call.search
        count: 2

  - id: search_limit_scope
    phase: search_strategy
    description: Limit search scope to relevant directories when context allows.
    type: constraint
    prompt_condition: involves_codebase_search
    condition:
      metric: tool_call.search.scoped_to_directory
      operator: eq
      target: true
