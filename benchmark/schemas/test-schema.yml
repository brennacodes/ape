test_schema_version: "1.0"

# ---------------------------------------------------------------------------
# TEST CONFIG FILE SHAPE
# ---------------------------------------------------------------------------
# Defines the valid structure of a test-config file in benchmark/test-configs/.
# A test config encodes the verifiable behavioral expectations for one workflow
# source (e.g. centminmod) in one format (e.g. plain-text).
test_config_fields:
  fixture_id:
    type: String
    description: Identifies the workflow source this config covers. Must match the fixture stem.
    required: true
  description:
    type: String
    description: Human-readable description of the workflow and what it encodes.
    required: true
  phase_classification:
    type: Object
    description: Declares which phases are ordered (must appear in sequence) and which are floating (may appear anywhere).
    required: true
    fields:
      ordered:
        type: List[phase_name]
        description: Phases that must appear in the defined sequence when present in the trace.
      floating:
        type: List[phase_name]
        description: Phases that may appear at any point; excluded from ordering checks.
  phase_tool_mapping:
    type: Map[phase_name, phase_mapping]
    description: Maps phase names to the trace signals used to detect when a phase is active.
    required: true
  checks:
    type: List[check]
    description: The behavioral checks derived from the workflow source.
    required: true

# ---------------------------------------------------------------------------
# PHASE TOOL MAPPING FIELDS
# ---------------------------------------------------------------------------
# Fields supported on each entry in a test config's phase_tool_mapping block.
phase_tool_mapping_fields:
  signals:
    description: Trace event types whose presence indicates this phase is active.
  match:
    description: Optional string filter applied to signal args (e.g. 'git commit').
  position:
    description: Disambiguates phases that share signal types. Controls when in the trace a signal is attributed to this phase.
    default: any
    options: [before_all, before_implementation, between_tool_batches, after_implementation, after_verification, post_hoc, last, any]
  repeatable:
    description: Whether this phase can appear more than once in a trace (e.g. in a retry loop). When true, the runner treats each re-occurrence as a new cycle and validates ordering within cycles, not globally.
    default: false
    used_by: [strictly_ordered_subset]

# ---------------------------------------------------------------------------
# CHECK FIELDS
# ---------------------------------------------------------------------------
# Fields supported on each entry in a test config's checks list.
check_fields:
  id:
    type: String
    description: Unique identifier for this check within the test config.
    required: true
  phase:
    type: String
    description: The phase this check belongs to. Must be a phase declared in phase_classification.
    required: true
  description:
    type: String
    description: Human-readable description of the behavior being verified.
    required: true
  type:
    type: String
    description: The structural role of this check.
    required: true
    options: [gate, constraint, sequential_step, workflow_order, command_adherence]
  condition:
    type: Object
    description: The evaluable assertion. See condition_fields.
    required: true
  prompt_condition:
    type: String
    description: >
      Name of a condition from prompt-schema.yml. When the condition evaluates to false
      for a given prompt, this check is skipped. Negate with "!" prefix.
    required: false
  timing:
    description: When to evaluate this check against the trace.
    options: [any, task_completed]
    default: any
  iteration:
    description: For workflows with repeatable phases, controls which cycle(s) the check is evaluated against.
    default: any
    options:
      any: Evaluated across the full trace regardless of cycles.
      each: Must pass independently on every cycle.
      last: Evaluated only on the final cycle.

# ---------------------------------------------------------------------------
# CONDITION FIELDS
# ---------------------------------------------------------------------------
# Fields supported in every check's condition block.
condition_fields:
  metric:
    type: String
    description: The trace value or computed metric being evaluated. Left-hand side of the assertion.
    required: true
  operator:
    type: String
    description: The comparison or sequence operator to apply. Must be a key in transforms, scalar_operators, or collection_operators.
    required: true
  target:
    description: The expected value or reference metric. Right-hand side of the assertion.
    required: true
  transform:
    description: Reduces the metric to a scalar before the operator is applied. Only applies to the metric (left-hand side). Omit when the metric is already a scalar or when using a collection operator.
    see: transforms
  target_args:
    description: Filters the target event to only calls whose args match this value. Supports ${variable} interpolation.
  metric_args:
    description: Filters the metric event to only calls whose primary arg contains this value. Supports ${variable} interpolation. Use instead of target_args when the filter should apply to the metric (left-hand) side.
  window:
    description: For windowed operators, the maximum number of trace steps to look back.
    type: integer
    used_by: [each_preceded_by_within_N_steps]

# ---------------------------------------------------------------------------
# EVALUATION DEFAULTS
# ---------------------------------------------------------------------------
timing_default: any     # Options: any | task_completed

# ---------------------------------------------------------------------------
# OPERATOR VOCABULARY
# ---------------------------------------------------------------------------
# Names and logic for all valid operators. The evaluator implements these as
# code; this block defines the interface contract.
#
# Evaluation order for a condition:
#   1. Resolve metric from trace
#   2. Apply transform (if present) → scalar
#   3. Apply operator against target
#
# "inputs" describes what A (metric/transformed metric) and B (target) must be.

# -- TRANSFORMS --------------------------------------------------------------
# Applied to the metric before comparison. Specified via the "transform" field.
transforms:
  count:
    input: event_list | collection
    output: integer
    description: Number of events or items in the collection.
  length:
    input: string | list
    output: integer
    description: Character length of a string, or item count of a list.
  first:
    input: ordered_list
    output: item
    description: First element of the collection.
  last:
    input: ordered_list
    output: item
    description: Last element of the collection.
  min:
    input: numeric_list
    output: numeric
    description: Minimum value in the collection.
  max:
    input: numeric_list
    output: numeric
    description: Maximum value in the collection.

# -- SCALAR OPERATORS --------------------------------------------------------
# Compare two scalar values. Use after a transform, or when the metric is
# already a scalar (e.g. a property path ending in .count or .length).
scalar_operators:
  eq:
    inputs: {A: scalar, B: scalar}
    logic: "A == B"
  neq:
    inputs: {A: scalar, B: scalar}
    logic: "A != B"
  gt:
    inputs: {A: numeric, B: numeric}
    logic: "A > B"
  gte:
    inputs: {A: numeric, B: numeric}
    logic: "A >= B"
  lt:
    inputs: {A: numeric, B: numeric}
    logic: "A < B"
  lte:
    inputs: {A: numeric, B: numeric}
    logic: "A <= B"

# -- COLLECTION OPERATORS ----------------------------------------------------
# Operate on sets or sequences. No transform should be applied alongside these.
collection_operators:
  exists_before:
    inputs: {A: event_type, B: event_type}
    logic: "min(index(A)) < min(index(B))"
    note: At least one A appears before the first B.

  exists_after:
    inputs: {A: event_type, B: event_type}
    logic: "max(index(A)) > max(index(B))"
    note: At least one A appears after the last B.

  exists_between:
    inputs: {A: event_type, B: [event_type_start, event_type_end]}
    logic: "exists i: index(B[0]) < index(A[i]) < index(B[1])"

  strictly_precedes:
    inputs: {A: event_type, B: event_type}
    logic: "all occurrences of B appear after all occurrences of A"

  strictly_ordered_subset:
    inputs: {A: phase_list_observed, B: phase_list_defined}
    logic: >
      Filter A to only phases present in B. The resulting subsequence must
      respect the relative order defined in B. Phases not in B are ignored.
      Cycle-aware: when a phase marked repeatable: true re-appears in the trace,
      the runner treats it as the start of a new cycle and resets the ordering
      check. Order is validated within each cycle independently.
    note: Replaces is_subsequence_of for phase ordering checks.

  is_subsequence_of:
    inputs: {A: phase_list_observed, B: phase_list_defined}
    logic: "A is a subsequence of B"
    deprecated: true
    replaced_by: strictly_ordered_subset

  subset_of:
    inputs: {A: set, B: set}
    logic: "A ⊆ B"

  each_preceded_by_within_N_steps:
    inputs: {A: event_list, B: event_type, window: integer}
    logic: >
      For every event in A at trace index i, there exists an event of type B
      at trace index j where j < i and (i - j) <= window.
    default_window: 10

  precedes_per_path:
    inputs: {A: event_type, B: event_type}
    logic: >
      For each unique file path P, if B(P) occurs in the trace,
      A(P) must also occur at an earlier trace index.

  not_contains:
    inputs: {A: set, B: scalar}
    logic: "B ∉ A"

  regex_not_match:
    inputs: {A: string_list, B: regex_string}
    logic: "no element of A matches pattern B"

  has_key:
    inputs: {A: dict, B: string}
    logic: "B is a key in A"

  contains:
    inputs: {A: list, B: scalar}
    logic: "B ∈ A"

  contains_count_gte:
    inputs: {A: parallel_batch, B: {metric: event_type, count: integer}}
    logic: "count of B.metric events in A >= B.count"
    note: >
      Special case: the count comparison is internal to this operator because
      both sides are event types within a batch context. Not decomposable into
      transform + scalar_operator at the top level.

  contains_independent_args:
    inputs: {A: parallel_batch}
    logic: >
      For each pair of calls in A, neither call's args depend on the output
      of the other call.
    v1_rule: >
      Call B is considered dependent on call A when any string value in B's
      args appears verbatim as a key or string value in A's raw result JSON.
      If no such match exists, the calls are treated as independent.
    note: "v2: full data-flow analysis."
    status: deferred

  not_contains_dependent_args:
    inputs: {A: parallel_batch}
    logic: >
      No call in A has an arg whose value was produced by another call
      in the same batch.
    v1_rule: >
      A call's arg is considered produced-by a sibling when any string value
      in that arg appears verbatim as a key or string value in the sibling's
      raw result JSON.
    note: "v2: full data-flow analysis."
    status: deferred

  first_search_broader_than_final:
    inputs: {A: ordered_list_of_search_calls}
    logic: >
      The pattern.length of the first search call is <= the pattern.length
      of the last search call in A. Intermediate calls are unconstrained,
      allowing accordion-style search patterns.
    note: Replaces non_decreasing, which was too strict for real debugging flows.

# ---------------------------------------------------------------------------
# CYCLE METRICS
# ---------------------------------------------------------------------------
# Computed automatically by the evaluator when repeatable phases are present.
# Reference these by name in check conditions — no special syntax required.
cycle_metrics:
  phase.cycle_count:
    type: integer
    description: >
      Number of times the repeatable phase group has been entered.
      Incremented each time a phase marked repeatable: true re-appears
      after a non-repeatable phase. Use with scalar_operators to assert
      iteration limits.
    example:
      metric: phase.cycle_count
      operator: lte
      target: 3
  phase.current_cycle:
    type: integer
    description: >
      Index of the cycle currently being evaluated (1-based).
      Available for use in iteration: each checks to scope assertions
      to a specific pass if needed.
