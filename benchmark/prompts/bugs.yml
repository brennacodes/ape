description: >
  Bug-fix task context. Presents a user-reported symptom without disclosing
  root cause or location. Exercises investigation, implementation, scoping,
  and verification checks for format-adherence comparison. The prompt is
  deliberately neutral about workflow sequence — it says *what* is wrong,
  not *how* to approach the fix.
prompt: |
  For some reason, ${presentation}. Can you fix this?
conditions:
  explicit_edit_requested: true
  involves_codebase_search: true
# NOTE: Removed ${optional_modifier} placeholder and optional_modifier fields
# from app-config items (interactive_prompt_panic, race_condition_in_cache)
# to prevent contamination of the no-workflow baseline condition. The modifier
# text ("Make sure to test...") constitutes workflow guidance that should not
# appear in the control condition. This ensures proper experimental isolation.
