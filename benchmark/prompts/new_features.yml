description: >
  New-feature task context. Requests implementation of a described feature
  without prescribing workflow steps. Exercises investigation, implementation,
  and verification checks while disabling forbid_unprompted_file_creation
  (file creation is expected for new features). Used for format-adherence
  comparison.
prompt: |
  Please implement the following feature: ${feature}. ${optional_modifier}
conditions:
  explicit_edit_requested: true
  explicit_feature_requested: true
  involves_codebase_search: true
