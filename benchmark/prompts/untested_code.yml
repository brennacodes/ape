description: >
  Test-writing task context. Identifies an untested code area by description
  and location, then asks for test coverage. Exercises investigation (should
  still read surrounding code to understand the API), implementation (test
  file creation is expected), and verification checks. The location hint
  reduces ambiguity but does not eliminate the need for codebase exploration.
  Used for format-adherence comparison.
prompt: |
  The ${description} has no test coverage. Please add tests for the code in ${location}. ${optional_modifier}
conditions:
  explicit_edit_requested: true
  involves_codebase_search: true
