app:
  name: bivvy
  description: Interactive development environment setup automation CLI tool written in Rust
  location: /Users/brenna/Documents/personal/ai-stuff/ape copy/benchmark/fixtures/apps/bivvy
  commands:
    start: "cargo run"
    watch: "cargo check"

workflow_files:
  - CLAUDE.md
  - .claude/bivvy-dev-workflow.md

bugs:
  silent_yaml_failure:
    description: Silent failure on invalid YAML — the config loader swallows YAML parsing errors and falls back to default config without warning
    presentation: the app falls back to default config without any warning when my .bivvy.yml is invalid
    location: src/config/loader.rs
    impact: Users are confused when their config changes are ignored
  interactive_prompt_panic:
    description: Panic on EOF in interactive prompts — hitting Ctrl+D during a dialoguer prompt unwraps an error and panics
    presentation: the interactive prompt panics with an unwrap error when I press Ctrl+D
    location: src/ui/prompts.rs
    impact: Ugly crash instead of graceful exit
  race_condition_in_cache:
    description: Race condition in cache invalidation — concurrent tool installations can corrupt the local state index
    presentation: the cache sometimes gets corrupted when running multiple tool installations at once
    location: src/cache/store.rs
    impact: Corrupted state, requiring manual wipe

architectural_issues:
  hardcoded_home_dir:
    description: Hardcoded ~/.bivvy paths across many subsystems (state, snapshots, logs, registry, telemetry, trust) instead of routing through the existing sys::data_dir() abstraction or standard XDG paths
    locations: src/state/store.rs, src/state/index.rs, src/snapshots/mod.rs, src/logging/mod.rs, src/sys.rs
    risk: Pollutes user home directory, ignores platform conventions, leaves the existing data_dir() abstraction unused
  tight_coupling_ui_runner:
    description: Tight coupling between Runner and UI — the runner module directly instantiates terminal spinners and prompts instead of using a trait
    locations: src/runner/workflow.rs, src/ui/terminal.rs
    risk: Hard to test runner logic in isolation, impossible to run headless easily
  inconsistent_error_handling:
    description: Inconsistent error handling across module boundaries - the cache, registry, feedback, session, and shell subsystems return anyhow::Result while config, runner, and ui return BivvyError::Result, requiring ad-hoc coercion via BivvyError::Other(anyhow::Error) at boundaries and losing typed-error context
    locations: src/cache/store.rs, src/registry/remote.rs, src/feedback/store.rs, src/session/store.rs, src/config/loader.rs
    risk: Poor error context for end users, brittle match statements, callers cannot distinguish typed errors after coercion

new_features:
  toml_config_support:
    feature: TOML configuration support — allow users to use bivvy.toml instead of bivvy.yml, parsing it with the toml crate
    impact: Better ecosystem fit for Rust developers
  dry_run_mode:
    feature: Dry run mode — add a --dry-run flag that prints what would be installed or changed without actually executing the shell commands
    impact: Safer onboarding for new users
  github_actions_formatter:
    feature: "GitHub Actions output formatter — add an output mode that emits ::error:: annotations for CI environments"
    impact: Better CI integration
