description: >
  Architectural-refactor task context. Points at a known structural concern
  without prescribing investigation or implementation sequence. Exercises
  investigation, implementation, scoping, and verification checks for
  format-adherence comparison. Sets is_large_refactor for any checks that
  gate on refactor scope (none in centminmod v1, but available for future
  test configs).
prompt: |
  I'm concerned about the ${description}. This needs to be improved. ${optional_modifier}
conditions:
  explicit_edit_requested: true
  is_large_refactor: true
  involves_codebase_search: true
